  # Pinned to 5.x on purpose: 6.x is ESM-only and loads its worker from a
  # sibling file that a plugin chunk cannot serve (runtime contract #22).
  - maplibre-gl@5.24.0
  - '@deepseek-ai/dsh-client-connection@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-credentials@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-jobs@0.1.7-alpha.2 || 0.1.7-rc.1'
