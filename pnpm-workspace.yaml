packages:
  - 'packages/*'

# esbuild ships a postinstall that links its platform binary. pnpm >=10 refuses
# to run dependency build scripts until they are explicitly allowed -- the same
# gate a user meets when installing this plugin from git (design ch.16).
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.4'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/dsh-agent@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-brand@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-client-locale@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-invariants@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-llm@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-ptc-runtime@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-sandbox-policy@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-sandbox@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-scope@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-session-projection@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-session@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-system-prompt@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-timeout@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-tools@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-typert-protocol@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-user-approval@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-util-crypto@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-util-values@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/schemastery@3.18.4'
  - '@deepseek-ai/dsh-client-ui-renderer@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-client-ui-tool@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-client-ui-settings@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-skill@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-http-proxy@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-subprocess@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-home-paths@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-storage@0.1.7-alpha.2 || 0.1.7-rc.1'
